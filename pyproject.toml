# Tool configuration only — this project's dependencies live in requirements.txt
# / requirements-dev.txt (ADR-0001), not here. No [project] table is intentional.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["sukoon"]
omit = ["sukoon/app.py", "sukoon/config.py"]
