# Tool configuration only — this project's dependencies live in requirements.txt
# / requirements-dev.txt (ADR-0001), not here. No [project] table is intentional.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: spawns a subprocess or is otherwise slower than a unit test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes migrations/versions/*.py; their long op.f(...) constraint-name
# lines are machine-generated and not ours to reformat.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["sukoon"]
omit = ["sukoon/app.py", "sukoon/config.py"]
